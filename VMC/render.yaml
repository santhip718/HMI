# Render Blueprint for VMC Operator HMI
# Automatically deploys PostgreSQL, ASP.NET Core API, and React Frontend

databases:
  - name: vmc-hmi-db
    databaseName: hmi
    user: hmi
    plan: free
    ipAllowList:
      - source: 0.0.0.0/0
        description: Allow incoming from anywhere

services:
  # ---------------------------------------------------------------------------
  # Backend API (ASP.NET Core .NET 8, dockerized)
  # ---------------------------------------------------------------------------
  - type: web
    name: vmc-hmi-backend
    runtime: docker
    plan: free
    dockerfilePath: Dockerfile.backend
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_HTTP_PORTS
        value: "8080"
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: JWT__SIGNINGKEY
        generateValue: true
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: vmc-hmi-db
          property: connectionString
      - key: FrontendUrl
        value: https://vmc-hmi-frontend.onrender.com

  # ---------------------------------------------------------------------------
  # Frontend (React + Vite static SPA)
  # ---------------------------------------------------------------------------
  - type: web
    name: vmc-hmi-frontend
    runtime: static
    buildCommand: cd frontend && npm install --no-audit && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: VITE_API_BASE_URL
        value: https://vmc-hmi-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
